name: 🔨 Build & Push to production branch

on:
  workflow_dispatch:   # Manual trigger from GitHub Actions tab

  push:
    branches:
      - main           # Auto trigger on every push to main

concurrency:
  group: build-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: 🔨 Build Frontend & Push → production branch
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build production bundle
        working-directory: frontend
        env:
          NODE_ENV: production
        run: npm run build

      - name: 📋 Prepare files in /tmp
        run: |
          mkdir -p /tmp/deploy/public_html
          mkdir -p /tmp/deploy/api

          # Frontend built files
          cp -r frontend/dist/. /tmp/deploy/public_html/

          # PHP backend files
          cp -r api/config      /tmp/deploy/api/
          cp -r api/controllers /tmp/deploy/api/
          cp -r api/core        /tmp/deploy/api/
          cp -r api/cron        /tmp/deploy/api/
          cp -r api/middleware  /tmp/deploy/api/
          cp -r api/public      /tmp/deploy/api/
          cp -r database        /tmp/deploy/
          cp -r scripts         /tmp/deploy/
          cp    .env.example    /tmp/deploy/

          # .htaccess for SPA routing
          cat > /tmp/deploy/public_html/.htaccess << 'HTEOF'
          Options -Indexes
          <IfModule mod_rewrite.c>
              RewriteEngine On
              RewriteCond %{HTTPS} off
              RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
              RewriteRule ^api/(.*)$ api/public/index.php [QSA,L]
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule ^ index.html [L]
          </IfModule>
          <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$">
              Header set Cache-Control "max-age=31536000, public, immutable"
          </FilesMatch>
          HTEOF

          echo "=== Build ready ==="
          find /tmp/deploy -type f | head -60

      - name: 🔀 Commit & push to production branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin production
          git checkout production

          # Remove old files
          git rm -rf . --quiet 2>/dev/null || true

          # Copy new build
          cp -r /tmp/deploy/public_html ./public_html
          cp -r /tmp/deploy/api         ./api
          cp -r /tmp/deploy/database    ./database
          cp -r /tmp/deploy/scripts     ./scripts
          cp    /tmp/deploy/.env.example ./.env.example

          # README
          echo "# TadbeerGo — Production Build" > README.md
          echo "" >> README.md
          echo "Auto-generated from \`main\` branch. Do NOT edit directly." >> README.md
          echo "" >> README.md
          echo "Built: $(date -u '+%Y-%m-%d %H:%M UTC')" >> README.md
          echo "Commit: ${{ github.sha }}" >> README.md

          git add -A
          git status
          git commit -m "build: $(date -u '+%Y-%m-%d %H:%M UTC') from main@$(echo ${{ github.sha }} | cut -c1-7)" || echo "Nothing to commit"
          git push origin production
          echo "✅ Done! production branch updated."
