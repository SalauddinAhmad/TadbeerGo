name: 🚀 Deploy to Hostinger (Production)

on:
  # ✅ Manually trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

  # ✅ Auto deploy on push to main branch
  push:
    branches:
      - main

# Prevent concurrent deployments
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Build Frontend
  # ─────────────────────────────────────────
  build-frontend:
    name: 🔨 Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build production bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          NODE_ENV: production
        run: npm run build

      - name: 📂 List build output
        run: |
          echo "=== Build Output ==="
          ls -la frontend/dist/
          echo "=== Assets folder ==="
          ls -la frontend/dist/assets/ | head -20

      - name: 📤 Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────
  # JOB 2: Deploy to Hostinger via FTP
  # ─────────────────────────────────────────
  deploy-hostinger:
    name: 🌐 Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: production
      url: ${{ secrets.APP_URL }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: deploy/public_html

      - name: 📋 Prepare backend files
        run: |
          mkdir -p deploy/api
          cp -r api/config deploy/api/
          cp -r api/controllers deploy/api/
          cp -r api/core deploy/api/
          cp -r api/cron deploy/api/
          cp -r api/middleware deploy/api/
          cp -r api/public deploy/api/
          echo "Backend files prepared"

      - name: 📝 Create production .htaccess
        run: |
          cat > deploy/public_html/.htaccess << 'HTACCESS'
          <IfModule mod_rewrite.c>
              RewriteEngine On

              # Force HTTPS
              RewriteCond %{HTTPS} off
              RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

              # Route /api requests to PHP backend
              RewriteRule ^api/(.*)$ api/public/index.php [QSA,L]

              # Frontend SPA routing (React Router)
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteRule ^ index.html [L]
          </IfModule>

          <IfModule mod_headers.c>
              Header always set X-Content-Type-Options "nosniff"
              Header always set X-Frame-Options "SAMEORIGIN"
              Header always set X-XSS-Protection "1; mode=block"
          </IfModule>

          <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
              Header set Cache-Control "max-age=31536000, public, immutable"
          </FilesMatch>
          HTACCESS
          echo ".htaccess created"

      - name: 📝 Create production environment config
        run: |
          cat > deploy/api/.env << ENVFILE
          APP_NAME="TadbeerGo"
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=${{ secrets.APP_URL }}
          FRONTEND_URL=${{ secrets.APP_URL }}

          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASS=${{ secrets.DB_PASS }}
          DB_CHARSET=utf8mb4

          SESSION_LIFETIME=86400
          SESSION_SECURE=true
          CSRF_SECRET=${{ secrets.CSRF_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}

          APP_TIMEZONE=Asia/Dhaka
          ENVFILE
          echo "Production .env created"

      - name: 🚀 Deploy frontend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: deploy/public_html/
          server-dir: public_html/
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: 🚀 Deploy PHP backend to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: deploy/api/
          server-dir: api/
          protocol: ftps
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**

      - name: ✅ Deployment Complete
        run: |
          echo "TadbeerGo deployed to Hostinger!"
          echo "URL: ${{ secrets.APP_URL }}"
          echo "Commit: ${{ github.sha }}"

  # ─────────────────────────────────────────
  # JOB 3: Post-deploy notification
  # ─────────────────────────────────────────
  notify:
    name: 📣 Deployment Status
    runs-on: ubuntu-latest
    needs: [build-frontend, deploy-hostinger]
    if: always()

    steps:
      - name: ✅ Success
        if: needs.deploy-hostinger.result == 'success'
        run: |
          echo "Deployment SUCCESS!"
          echo "Repository: ${{ github.repository }}"
          echo "Deployed by: ${{ github.actor }}"

      - name: ❌ Failure
        if: needs.deploy-hostinger.result == 'failure'
        run: |
          echo "Deployment FAILED!"
          echo "Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
