  <head>

    <meta name="description" content="TadbeerGo - শায়খ মোখতার আহমাদের ব্যক্তিগত শিডিউল, দ্বীনি পাঠ্যক্রম, জুমু'আ খুতবাহ, লেকচার ও পিএস ডিজিটাল সহকারী" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#063F35" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Web App Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Modern Typography: Hind Siliguri, Noto Sans Bengali & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-emerald-500/20 selection:text-emerald-900 font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA on production HTTPS
      if ('serviceWorker' in navigator) {
        if (window.location.protocol === 'https:') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
          });
        } else if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
          // Unregister old service workers in local development to prevent stale caches
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let reg of registrations) reg.unregister();
          });
        }
      }
    </script>
  </body>
</html>
